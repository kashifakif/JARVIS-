<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EDF0F5;--card:#fff;--ink:#16213A;--muted:#5B6781;--line:#D5DBE6;--ready:#2F4B9B;--listen:#D6402F;--proc:#B7791F;--speak:#0E8F7E;--err:#8F1D1D;--errbg:#FBE9E7;--demo:#FFF1C9;--demoink:#6B4A00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162A;--card:#1A2240;--ink:#E8ECF7;--muted:#9AA6C4;--line:#2D3760;--ready:#5B7BE0;--errbg:#3A1C1C;--err:#FFB4A8;--demo:#3B3014;--demoink:#F2D98C}}
:root[data-theme="dark"]{--bg:#10162A;--card:#1A2240;--ink:#E8ECF7;--muted:#9AA6C4;--line:#2D3760;--ready:#5B7BE0;--errbg:#3A1C1C;--err:#FFB4A8;--demo:#3B3014;--demoink:#F2D98C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:1.7rem;font-weight:650;letter-spacing:-.02em}
h2{margin:0 0 8px;font-size:1rem;font-weight:650}
.demo{background:var(--demo);color:var(--demoink);border-radius:10px;padding:10px 12px;font-size:.88rem;line-height:1.4}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.mic{width:128px;height:128px;border-radius:50%;border:0;background:var(--ready);color:#fff;display:grid;place-items:center;position:relative;transition:background .2s}
.mic svg{width:52px;height:52px}
.mic[data-s=listening]{background:var(--listen)}.mic[data-s=processing]{background:var(--proc)}.mic[data-s=speaking]{background:var(--speak)}.mic[data-s=error]{background:var(--err);color:#fff}
.mic:disabled{opacity:.6}
.mic[data-s=listening]::after,.mic[data-s=speaking]::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--listen);animation:p 1.2s ease-out infinite}
.mic[data-s=speaking]::after{border-color:var(--speak)}
@keyframes p{from{transform:scale(.92);opacity:.6}to{transform:scale(1.18);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic::after{animation:none!important}}
button:focus-visible,input:focus-visible{outline:3px solid #7A9BFF;outline-offset:3px}
.status{font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.label{font-size:.82rem;color:var(--muted);margin-bottom:4px}
.text{margin:0;line-height:1.5;min-height:1.5em}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn,.chip{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px}
.btn.stop{border-color:var(--listen);color:var(--listen)}
.btn:disabled{opacity:.45}.chip{font-size:.88rem}
.err{background:var(--errbg);color:var(--err);border-radius:10px;padding:10px 12px;font-size:.9rem;line-height:1.4}
.err[hidden]{display:none}
.send{display:flex;gap:8px}
.send input{flex:1;min-width:0;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.send button{border:0;background:var(--ready);color:#fff;border-radius:10px;padding:0 16px;font:inherit}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:.93rem;line-height:1.35}
li:first-child{border-top:0}
li input{margin-top:3px;width:18px;height:18px}
.done{text-decoration:line-through;color:var(--muted)}
.tag{font-size:.78rem;color:var(--muted)}.tag.od{color:var(--listen);font-weight:600}
</style>
</head>
<body>
<main>
<h1>Jarvis</h1>
<div class="demo" role="note"><b>Demo mode.</b> Every task, project and answer here is sample data. Nothing is connected to live records, Claude, calendars, Make or Telegram.</div>
<section class="stage">
<button class="mic" id="mic" data-s="ready" aria-label="Start listening"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button>
<div class="status" id="status" aria-live="polite">Ready. Tap to talk</div>
</section>
<div class="err" id="err" role="alert" hidden></div>
<section class="card">
<div class="label">You said</div><p class="text" id="said">…</p>
<div class="label" style="margin-top:12px">Jarvis</div><p class="text" id="reply">…</p>
<div class="row"><button class="btn stop" id="stop" disabled>Stop speaking</button><button class="btn" id="repeat" disabled>Repeat</button></div>
</section>
<div class="row" id="chips" style="margin-top:0"></div>
<form class="send" id="form"><input id="txt" placeholder="Or type a request" aria-label="Type a request" autocomplete="off"><button type="submit">Send</button></form>
<section class="card"><h2>Tasks (demo)</h2><ul id="tasks"></ul></section>
<section class="card"><h2>Projects (demo)</h2><ul id="projects"></ul></section>
</main>
<script>
const LANG="en-IN";
const P=[
{id:"allvion",name:"Allvion / Codegene",status:"Researching prospects and booking qualified appointments.",blocker:"Demo blocker: waiting on verified agreement terms before tracking commission.",opp:"Demo prospect asked for a meeting next week."},
{id:"opd",name:"OPD clinic software",status:"Collecting clinic workflow requirements.",blocker:"Demo blocker: no clinic has been interviewed this week.",opp:"Demo clinic is open to a pilot."},
{id:"bms",name:"BMS",status:"No BMS information is stored yet.",blocker:"No BMS details are stored yet. What does BMS cover, and who are its customers?"},
{id:"kh",name:"KH Furnishing",status:"Tracking inquiries and follow-ups.",blocker:"Demo blocker: two inquiries have had no reply for three days."},
{id:"video",name:"Video editing",status:"Two demo projects in progress.",blocker:"Demo blocker: one client has not sent raw footage.",opp:"Demo client may retain for monthly editing."},
{id:"aisales",name:"AI Sales OS",status:"Lead scoring prototype planned.",blocker:"Demo blocker: no approval workflow defined yet."},
{id:"personal",name:"Personal",status:"Daily planning.",blocker:"Nothing blocked."}];
const T=[
{id:"t1",p:"allvion",title:"Follow up with demo prospect Sharma Traders",due:"overdue",done:false,fu:true},
{id:"t2",p:"kh",title:"Reply to two furnishing inquiries",due:"today",done:false,fu:true},
{id:"t3",p:"opd",title:"Draft clinic interview questions",due:"today",done:false},
{id:"t4",p:"video",title:"Request raw footage from demo client",due:"today",done:false,fu:true},
{id:"t5",p:"personal",title:"Review weekly priorities",due:"tomorrow",done:false}];
const $=id=>document.getElementById(id);
const pn=id=>(P.find(p=>p.id===id)||{}).name||id;
const list=ts=>ts.map(t=>t.title+" for "+pn(t.p)).join("; ");
function find(t){
 if(/allvion|codegene/.test(t))return"allvion";if(/\bopd\b|clinic/.test(t))return"opd";if(/\bbms\b/.test(t))return"bms";
 if(/\bkh\b|furnishing/.test(t))return"kh";if(/video|editing/.test(t))return"video";if(/ai sales|lead scor/.test(t))return"aisales";
 if(/personal|my day/.test(t))return"personal";return null}
let last=null;
function respond(input){
 const t=input.toLowerCase(),open=T.filter(x=>!x.done),rk={overdue:0,today:1,tomorrow:2};
 const sorted=[...open].sort((a,b)=>rk[a.due]-rk[b.due]);
 if(/good morning|brief me|what should i do today|tell me about my businesses/.test(t)){
  const od=open.filter(x=>x.due==="overdue").length,td=open.filter(x=>x.due==="today").length;
  return"This is a demo briefing using sample data. Top priorities: "+list(sorted.slice(0,3))+". You have "+od+" overdue and "+td+" due today. No calendar is connected, so I can’t report meetings. Recommended next step: clear the overdue follow-up first."}
 if(/follow.?up/.test(t)&&!find(t)){const f=open.filter(x=>x.fu);return f.length?"Demo follow-ups needing attention: "+list(f)+".":"No open follow-ups in the demo data."}
 if(/commitment|not completed|overdue/.test(t)){const o=open.filter(x=>x.due==="overdue");return o.length?"Demo overdue items: "+list(o)+".":"No overdue items in the demo data."}
 if(/opportunit/.test(t))return"Demo opportunities. "+P.filter(p=>p.opp).map(p=>p.name+": "+p.opp).join(" ");
 const pid=find(t)||(/block|next|status|update|more|detail|this week/.test(t)?last:null);
 if(pid){last=pid;const p=P.find(x=>x.id===pid);if(/block/.test(t))return p.blocker;
  const m=open.filter(x=>x.p===pid);return p.name+", demo data. "+p.status+" "+(m.length?"Open demo tasks: "+list(m)+".":"No open demo tasks.")+" "+p.blocker}
 return"I’m in demo mode and know only sample data. Try: Good morning Jarvis, give me the Allvion update, which prospects need follow-up, or what is blocking BMS."}

const LABEL={ready:"Ready. Tap to talk",listening:"Listening…",processing:"Processing…",speaking:"Speaking…",error:"Error"};
const ERR={"not-allowed":"Microphone access is blocked. Tap the lock icon in Chrome’s address bar, allow Microphone, then tap the mic again. If it stays blocked, type below.",
"service-not-allowed":"Microphone access is blocked here. Type your request below.",
network:"Speech recognition needs an internet connection. Check your connection or type below.",
"no-speech":"No speech detected. Tap the mic and try again, or type below.",
"audio-capture":"No microphone found on this device.",unsupported:"This browser has no speech recognition. Use Chrome on Android, or type below."};
let state="ready",lastReply="",rec=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,synth=window.speechSynthesis;
function set(s){state=s;$("mic").dataset.s=s;$("status").textContent=LABEL[s];
 $("mic").disabled=s==="processing"||!SR;$("stop").disabled=s!=="speaking";$("mic").setAttribute("aria-label",s==="listening"?"Stop listening":"Start listening")}
function showErr(m){$("err").textContent=m;$("err").hidden=!m}
function speak(msg){
 if(!synth){set("ready");return}
 synth.cancel();set("speaking");
 const u=new SpeechSynthesisUtterance(msg);u.lang=LANG;
 u.onend=()=>{if(state==="speaking")set("ready")};
 u.onerror=e=>{if(e.error==="interrupted"||e.error==="canceled"){if(state==="speaking")set("ready");return}
  showErr("Couldn’t play audio ("+e.error+"). Tap Repeat to try again.");set("error")};
 synth.speak(u)}
function handle(q){
 q=q.trim();if(!q)return;
 if(synth)synth.cancel();
 $("said").textContent=q;showErr("");set("processing");
 setTimeout(()=>{lastReply=respond(q);$("reply").textContent=lastReply;$("repeat").disabled=!synth;speak(lastReply)},350)}
$("mic").onclick=()=>{
 if(state==="listening"){rec&&rec.stop();return}
 if(synth)synth.cancel();
 showErr("");$("said").textContent="…";$("reply").textContent="…";set("listening");
 let fin="";
 try{
  rec=new SR();rec.lang=LANG;rec.interimResults=true;rec.continuous=false;
  rec.onresult=ev=>{let i2="";for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else i2+=r[0].transcript}
   $("said").textContent=(fin+i2).trim()||"…"};
  rec.onerror=ev=>{showErr(ERR[ev.error]||"Speech recognition failed ("+ev.error+"). Try again or type below.");set("error")};
  rec.onend=()=>{if(fin.trim())handle(fin);else if(state==="listening"){showErr("I didn’t catch that. Tap the mic and try again.");set("ready")}};
  rec.start()}catch(e){showErr("Couldn’t start the microphone. Type your request below.");set("error")}};
$("stop").onclick=()=>{if(synth)synth.cancel();set("ready")};
$("repeat").onclick=()=>{if(lastReply)speak(lastReply)};
$("form").onsubmit=e=>{e.preventDefault();handle($("txt").value);$("txt").value=""};
["Good morning, Jarvis","Give me the Allvion update","Which prospects need follow-up?","What is blocking BMS?"].forEach(c=>{
 const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=c;b.onclick=()=>handle(c);$("chips").appendChild(b)});
function render(){
 $("tasks").innerHTML="";
 T.forEach(t=>{const li=document.createElement("li"),cb=document.createElement("input");
  cb.type="checkbox";cb.checked=t.done;cb.setAttribute("aria-label","Complete: "+t.title);cb.onchange=()=>{t.done=cb.checked;render()};
  const d=document.createElement("div");
  const a=document.createElement("div");a.textContent=t.title;if(t.done)a.className="done";
  const g=document.createElement("div");g.className="tag"+(t.due==="overdue"&&!t.done?" od":"");g.textContent=pn(t.p)+", "+t.due;
  d.append(a,g);li.append(cb,d);$("tasks").appendChild(li)});
 $("projects").innerHTML="";
 P.forEach(p=>{const li=document.createElement("li"),d=document.createElement("div"),a=document.createElement("div"),g=document.createElement("div");
  a.textContent=p.name;g.className="tag";g.textContent=p.status;d.append(a,g);li.append(d);$("projects").appendChild(li)})}
render();set("ready");
if(!SR)showErr("Speech recognition isn’t available in this browser. Use Chrome on Android, or type your request below.");
</script>
</body>
</html>
